[project]
name = "langchain-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vikash yadav", email = "vy69803@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.2",
    "langchain-core>=1.6.3",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.6.2",
    "langchain-postgres>=0.0.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langsmith>=0.12.4",
    "numpy>=2.5.3",
    "plotly>=7.0.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
docling = [
    "docling>=2.129.0",
]
pdf = [
    "pypdf>=5.0.0",
]

[project.scripts]
langchain-rag = "langchain_rag:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
